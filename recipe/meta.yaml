{% set name = "numkit" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/numkit-{{ version }}.tar.gz
  sha256: 3c979d43b1deb8e1381916a73686cee31a974b9605e27b9092e24ee3ae8ac72a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.9
    - scipy >=1.0

test:
  imports:
    - numkit
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Becksteinlab/numkit
  summary: Numerical first aid kit (with numpy/scipy).
  doc_url: https://numkit.readthedocs.io/
  dev_url: https://github.com/Becksteinlab/numkit
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - orbeckst
    - njzjz
